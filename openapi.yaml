openapi: 3.1.0
info:
  title: Skald Bot API
  version: 1.0.0
  description: API for managing and streaming audio tracks for tabletop RPG games

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
    bearerAuth:
      type: http
      scheme: bearer
    queryAuth:
      type: apiKey
      in: query
      name: token

  schemas:
    Table:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        inviteToken:
          type: string
          description: Only returned to GMs.

    TableRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    TableSettings:
      type: object
      required: [masterVolume, typeVolumes, trackVolumes, trackOrder]
      properties:
        masterVolume:
          type: number
          minimum: 0
          maximum: 200
        typeVolumes:
          type: object
          description: GM volume percentages keyed by track-type name.
          additionalProperties:
            type: number
            minimum: 0
            maximum: 100
        trackVolumes:
          type: object
          description: GM volume percentages keyed by track UUID.
          additionalProperties:
            type: number
            minimum: 0
            maximum: 100
        trackOrder:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    TableSettingsPatch:
      type: object
      additionalProperties: false
      description: Omitted fields are preserved. Volume maps merge by key; trackOrder replaces the saved order.
      properties:
        masterVolume:
          $ref: "#/components/schemas/TableSettings/properties/masterVolume"
        typeVolumes:
          $ref: "#/components/schemas/TableSettings/properties/typeVolumes"
        trackVolumes:
          $ref: "#/components/schemas/TableSettings/properties/trackVolumes"
        trackOrder:
          $ref: "#/components/schemas/TableSettings/properties/trackOrder"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
        error:
          type: string

    JoinRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    JoinTokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    AuthStatusResponse:
      type: object
      required:
        - authenticated
        - role
      properties:
        authenticated:
          type: boolean
        role:
          type: string
          enum: [gm, player]

    Track:
      type: object
      required:
        - id
        - createdAt
        - name
        - path
        - typeID
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        name:
          type: string
        path:
          type: string
        typeID:
          type: string
          format: uuid
        playback:
          $ref: "#/components/schemas/PlaybackSettings"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    PlaybackSettings:
      type: object
      description: Times in seconds, shared across every table using the track. Null clears an optional point.
      required: [startTime, endTime, loopBackTime]
      properties:
        startTime:
          type: number
          minimum: 0
          default: 0
        endTime:
          type: [number, "null"]
          exclusiveMinimum: 0
        loopBackTime:
          type: [number, "null"]
          minimum: 0

    UpdateTrackRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        typeID:
          type: string
          format: uuid
          nullable: true
        playback:
          $ref: "#/components/schemas/PlaybackSettings"
        tagIDs:
          type: array
          description: Replaces the track's tags. Omit to preserve; an empty array removes all tags.
          uniqueItems: true
          items:
            type: string
            format: uuid

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string

    TagInput:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    TrackUsage:
      type: object
      required: [tableCount]
      properties:
        tableCount:
          type: integer
          format: int64
          minimum: 0

    Waveform:
      type: object
      required: [peaks]
      properties:
        peaks:
          type: array
          description: Peak amplitude of equal-length slices of the track, scaled so the loudest slice is 1
          items:
            type: number
            minimum: 0
            maximum: 1

    TrackType:
      type: object
      required:
        - id
        - name
        - color
        - isRepeating
        - allowSimultaneousPlay
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        isRepeating:
          type: boolean
        allowSimultaneousPlay:
          type: boolean

paths:
  /api/v1/tables/{tableID}/settings:
    parameters:
      - name: tableID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get the table's saved GM mix and track order (GM only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Table settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSettings"
        "401":
          description: GM authentication required
        "404":
          description: Table not found
    patch:
      summary: Save partial GM mixing and ordering preferences (GM only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableSettingsPatch"
      responses:
        "200":
          description: Saved table settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSettings"
        "400":
          description: Invalid table settings
        "401":
          description: GM authentication required
        "404":
          description: Table not found

  /api/v1/tables:
    get:
      summary: List GM tables and their invite tokens
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
    post:
      summary: Create a table
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableRequest"
      responses:
        "201":
          description: Created table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Invalid table name

  /api/v1/tables/current:
    get:
      summary: Resolve the invited player's table or the GM's legacy default table
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Table not found

  /api/v1/tables/{tableID}:
    parameters:
      - name: tableID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a table (players may only access their invited table)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "403":
          description: Wrong table
        "404":
          description: Table not found
    put:
      summary: Rename a table (GM only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableRequest"
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Invalid table name
        "404":
          description: Table not found
    delete:
      summary: Delete a table without deleting library tracks (GM only)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Table deleted
        "404":
          description: Table not found

  /api/v1/tables/{tableID}/tracks:
    get:
      summary: List a table's associated library tracks (GM only)
      security:
        - cookieAuth: []
      parameters:
        - name: tableID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Associated tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
        "404":
          description: Table not found

  /api/v1/tables/{tableID}/tracks/{trackID}:
    parameters:
      - name: tableID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: trackID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Associate an existing library track (GM only, idempotent)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Track associated
        "404":
          description: Table or track not found
    delete:
      summary: Remove a track from a table without deleting it from the library (GM only)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Track removed
        "404":
          description: Table not found

  /api/v1/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /api/v1/auth/status:
    get:
      summary: Get current authentication status
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"

  /api/v1/auth/logout:
    post:
      summary: Logout current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logout successful

  /api/v1/files:
    get:
      summary: List all audio tracks
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
        "403":
          description: Not authorized
    post:
      summary: Upload new audio track
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: string
                  format: binary
                name:
                  type: string
                typeID:
                  type: string
                  format: uuid
                tableID:
                  type: string
                  format: uuid
                  description: Optionally associate the upload with this table atomically.
      responses:
        "200":
          description: File uploaded successfully
        "403":
          description: Not authorized

  /api/v1/files/{trackID}:
    delete:
      summary: Delete an audio track
      security:
        - cookieAuth: []
      parameters:
        - name: trackID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedTableCount
          in: query
          description: Delete only if the track still belongs to this many tables.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Track deleted successfully
        "400":
          description: Invalid track ID or expected table count
        "403":
          description: Not authorized
        "404":
          description: Track not found
        "409":
          description: Table usage changed since it was checked
        "500":
          description: Failed to delete the track
    put:
      summary: Update audio track information
      security:
        - cookieAuth: []
      parameters:
        - name: trackID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrackRequest"
      responses:
        "200":
          description: Track updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          description: Invalid request body
        "403":
          description: Not authorized
        "404":
          description: Track not found
        "500":
          description: Internal server error

  /api/v1/files/{trackID}/usage:
    get:
      summary: Count the tables containing a library track
      security:
        - cookieAuth: []
      parameters:
        - name: trackID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current table usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackUsage"
        "400":
          description: Invalid track ID
        "401":
          description: Not authorized
        "404":
          description: Track not found
        "500":
          description: Failed to retrieve usage

  /api/v1/files/{trackID}/waveform:
    get:
      summary: Get the amplitude waveform of a track (GM only)
      security:
        - cookieAuth: []
      parameters:
        - name: trackID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Peak amplitudes across the whole track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waveform"
        "400":
          description: Invalid track ID
        "401":
          description: Not authorized
        "404":
          description: Track not found
        "500":
          description: Failed to generate the waveform

  /api/v1/joinToken:
    get:
      summary: Get the legacy default table's invite token (GM only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Join token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinTokenResponse"
        "403":
          description: Not authorized
        "404":
          description: The default table has been deleted

  /api/v1/stream/{path}:
    get:
      summary: Stream audio content
      security:
        - cookieAuth: []
        - bearerAuth: []
        - queryAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audio stream
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "403":
          description: Not authorized
        "404":
          description: File not found

  /api/v1/trackTypes:
    get:
      summary: Get available track types
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of track types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackType"
        "403":
          description: Not authorized

  /api/v1/tags:
    get:
      summary: List reusable library tags (GM only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Tags ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      summary: Create a reusable library tag (GM only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Invalid name or color
        "409":
          description: Tag name already exists (case insensitive)

  /api/v1/tags/{tagID}:
    parameters:
      - name: tagID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Rename or recolor a tag across the library (GM only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Invalid name or color
        "404":
          description: Tag not found
        "409":
          description: Tag name already exists
    delete:
      summary: Delete a tag and remove its track assignments (GM only)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Tag deleted; audio and table associations are unchanged
        "404":
          description: Tag not found

  /api/v1/ws:
    get:
      summary: WebSocket connection for real-time updates
      parameters:
        - name: tableID
          in: query
          description: GM table scope; defaults to the legacy table. Players are scoped by their invite.
          schema:
            type: string
            format: uuid
      security:
        - cookieAuth: []
        - queryAuth: []
      responses:
        "101":
          description: Switching protocols to WebSocket
        "403":
          description: Not authorized
