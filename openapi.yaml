openapi: 3.1.0
info:
  title: Skald Bot API
  version: 1.0.0
  description: API for managing and streaming audio tracks for tabletop RPG games

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
  schemas:
    SetupStatus:
      type: object
      required: [required, username]
      properties:
        required:
          type: boolean
        username:
          type: string
    ClaimInstance:
      type: object
      additionalProperties: false
      required: [code, username, password]
      properties:
        code:
          type: string
          writeOnly: true
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 12
          writeOnly: true
    Profile:
      type: object
      required: [username]
      properties:
        username:
          type: string
    PasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, password]
      properties:
        currentPassword:
          type: string
          writeOnly: true
        password:
          type: string
          minLength: 12
          writeOnly: true
    Table:
      type: object
      required: [id, externalID, name]
      properties:
        id:
          type: string
          format: uuid
        externalID:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Random URL-safe identifier that grants access to this table
        name:
          type: string
    TableRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    TableSettings:
      type: object
      required: [masterVolume, typeVolumes, trackOrder]
      properties:
        masterVolume:
          type: number
          minimum: 0
          maximum: 200
        typeVolumes:
          type: object
          description: GM volume percentages keyed by track-type name.
          additionalProperties:
            type: number
            minimum: 0
            maximum: 100
        trackOrder:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    TableSettingsPatch:
      type: object
      additionalProperties: false
      description: Omitted fields are preserved. typeVolumes merges by key; trackOrder replaces the saved order.
      properties:
        masterVolume:
          $ref: "#/components/schemas/TableSettings/properties/masterVolume"
        typeVolumes:
          $ref: "#/components/schemas/TableSettings/properties/typeVolumes"
        trackOrder:
          $ref: "#/components/schemas/TableSettings/properties/trackOrder"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
        error:
          type: string

    AuthStatusResponse:
      type: object
      required:
        - authenticated
        - role
      properties:
        authenticated:
          type: boolean
        role:
          type: string
          enum: [gm, player]

    Track:
      type: object
      required:
        - id
        - createdAt
        - name
        - path
        - typeID
        - volume
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        name:
          type: string
        path:
          type: string
        typeID:
          type: string
          format: uuid
        volume:
          type: number
          minimum: 0
          maximum: 100
          description: GM volume percentage shared by every table using the track.
        playback:
          $ref: "#/components/schemas/PlaybackSettings"
        status:
          type: string
          enum: [ready, processing, failed]
          default: ready
        processingError:
          type: string
        tagIDs:
          type: array
          description: Tags applied to the track, ordered by tag name. Omitted when the track has no tags.
          items:
            type: string
            format: uuid

    VideoMetadata:
      type: object
      required: [url, name, duration, sizeBytes, sizeEstimated]
      properties:
        url:
          type: string
          format: uri
        name:
          type: string
        duration:
          type: number
          description: Duration in seconds.
        sizeBytes:
          type: [integer, "null"]
          format: int64
          description: Selected audio download size, or null when unavailable.
        sizeEstimated:
          type: boolean

    PlaybackSettings:
      type: object
      description: Times in seconds, shared across every table using the track. Null clears an optional point.
      required: [startTime, endTime, loopBackTime]
      properties:
        startTime:
          type: number
          minimum: 0
          default: 0
        endTime:
          type: [number, "null"]
          exclusiveMinimum: 0
        loopBackTime:
          type: [number, "null"]
          minimum: 0

    LivePlaybackPatch:
      type: object
      additionalProperties: false
      properties:
        isPlaying: {type: boolean}
        volume: {type: number, minimum: 0, maximum: 100}
        currentTime: {type: number, minimum: 0}
        duration: {type: number, minimum: 0}
        playback:
          $ref: "#/components/schemas/PlaybackSettings"
    LivePlaybackTrack:
      type: object
      required: [fileID, name, isPlaying, volume, isRepeating, currentTime, duration, trackType, playback, positionVersion, seekVersion, seekTarget, seekLanding]
      properties:
        fileID: {type: string, format: uuid}
        name: {type: string}
        isPlaying: {type: boolean}
        volume: {type: number}
        isRepeating: {type: boolean}
        currentTime: {type: number}
        duration: {type: number}
        trackType: {type: string}
        playback:
          $ref: "#/components/schemas/PlaybackSettings"
        positionVersion: {type: integer}
        seekVersion: {type: integer}
        seekTarget: {type: [number, "null"]}
        seekLanding: {type: [number, "null"]}
    LivePlaybackSnapshot:
      type: object
      required: [revision, tracks]
      properties:
        revision:
          type: integer
          description: Snapshot ordering shared with playbackStateChanged events within a server process.
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/LivePlaybackTrack"
        settings:
          $ref: "#/components/schemas/TableSettings"
    LiveMixSnapshot:
      type: object
      additionalProperties: false
      required: [tracks]
      properties:
        tracks:
          type: array
          items:
            type: object
            required: [fileID]
            properties:
              fileID: {type: string, format: uuid}
              isPlaying: {type: boolean}
              isRepeating: {type: boolean}
              volume: {type: number}
              currentTime: {type: number}
              duration: {type: number}
              playback:
                $ref: "#/components/schemas/PlaybackSettings"
        typeVolumes:
          type: object
          additionalProperties: {type: number}
    LiveMixVolumePatch:
      type: object
      additionalProperties: false
      required: [typeVolumes]
      properties:
        typeVolumes:
          type: object
          additionalProperties: {type: number}
    UpdateTrackRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        typeID:
          type: string
          format: uuid
          nullable: true
        volume:
          type: number
          minimum: 0
          maximum: 100
          description: GM volume percentage shared by every table using the track.
        playback:
          $ref: "#/components/schemas/PlaybackSettings"

    TrackUsage:
      type: object
      required: [tableCount]
      properties:
        tableCount:
          type: integer
          format: int64
          minimum: 0

    Waveform:
      type: object
      required: [peaks]
      properties:
        peaks:
          type: array
          description: Peak amplitude of equal-length slices of the track, scaled so the loudest slice is 1
          items:
            type: number
            minimum: 0
            maximum: 1

    TrackType:
      type: object
      required:
        - id
        - name
        - color
        - isRepeating
        - allowSimultaneousPlay
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        isRepeating:
          type: boolean
        allowSimultaneousPlay:
          type: boolean

    Tag:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: "^#[0-9A-F]{6}$"

    TagRequest:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          description: Trimmed before saving; names are unique without regard to case.
          minLength: 1
          maxLength: 40
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"

    DiscordStatus:
      type: object
      required: [enabled, state]
      properties:
        enabled:
          type: boolean
        state:
          type: string
          enum: [disconnected, connecting, connected, error]
        guildID:
          type: string
        channelID:
          type: string
        guildName:
          type: string
        channelName:
          type: string
        error:
          type: string

    DiscordDestination:
      type: object
      required: [guildID, channelID]
      properties:
        guildID:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'
        channelID:
          type: string
          pattern: '^[1-9][0-9]{0,19}$'

    DiscordChoice:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    DiscordSetup:
      type: object
      required: [installURL, guilds]
      properties:
        installURL:
          type: string
          format: uri
        guilds:
          type: array
          items:
            $ref: "#/components/schemas/DiscordChoice"

paths:
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      summary: Determine whether the instance needs to be claimed
      responses:
        "200":
          description: Setup status without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          description: Unable to load setup status
    post:
      operationId: claimInstance
      summary: Consume the one-time setup code and create the owner account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInstance"
      responses:
        "204":
          description: Instance claimed; sign in with the chosen credentials
        "400":
          description: Invalid username or password
        "401":
          description: Invalid or expired setup code
        "403":
          description: Cross-origin request
        "409":
          description: Instance already claimed
        "500":
          description: Unable to persist credentials

  /api/v1/profile:
    get:
      operationId: getProfile
      summary: Get the GM profile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: GM authentication required
        "500":
          description: Unable to load the profile
    patch:
      operationId: changePassword
      summary: Change the password without signing out existing GM sessions
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid password
        "401":
          description: Authentication required or current password incorrect
        "403":
          description: Cross-origin request
        "500":
          description: Unable to persist password

  /api/v1/discord/setup:
    get:
      summary: Get the bot installation link and installed servers (GM only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Discord installation and server choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordSetup"
        "401":
          description: GM authentication required
        "404":
          description: Discord disabled
        "502":
          description: Discord discovery failed

  /api/v1/discord/servers/{guildID}/channels:
    get:
      summary: List regular voice channels in an installed server (GM only)
      security:
        - cookieAuth: []
      parameters:
        - name: guildID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Voice channel choices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscordChoice"
        "401":
          description: GM authentication required
        "404":
          description: Discord disabled
        "502":
          description: Discord channel discovery failed

  /api/v1/tables/{tableID}/discord:
    parameters:
      - name: tableID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Inspect the configured Discord voice connection (GM only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Disabled, connecting, connected, disconnected, or failed connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordStatus"
        "401":
          description: GM authentication required
        "404":
          description: Table not found
    post:
      summary: Connect to a selected Discord channel and save it for this table (GM only)
      security:
        - cookieAuth: []
      requestBody:
        required: false
        description: Omit to reconnect to this table's saved destination
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscordDestination"
      responses:
        "200":
          description: Bot connected to voice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordStatus"
        "401":
          description: GM authentication required
        "400":
          description: Invalid selection or no saved destination
        "404":
          description: Discord disabled or table not found
        "409":
          description: Mix not ready or bot already connected to a table in this server
        "500":
          description: Unable to persist destination; connection cancelled
        "502":
          description: Discord voice connection failed
    delete:
      summary: Disconnect this table's Discord stream (GM only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Bot disconnected from voice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscordStatus"
        "401":
          description: GM authentication required
        "404":
          description: Discord disabled or table not found
        "409":
          description: Bot reserved by another session
        "502":
          description: Disconnect failed

  /api/v1/tables/{tableID}/playback:
    parameters:
      - {name: tableID, in: path, required: true, schema: {type: string}}
    get:
      operationId: getTablePlayback
      summary: Read live playback for initial load or reconnection
      description: Players receive effective track volumes and no GM table settings.
      responses:
        "200":
          description: Current playback snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePlaybackSnapshot"
        "404": {description: Table not found}
  /api/v1/tables/{tableID}/playback/{trackID}:
    parameters:
      - {name: tableID, in: path, required: true, schema: {type: string}}
      - {name: trackID, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: patchTablePlayback
      summary: Change a track's live playback
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LivePlaybackPatch"
      responses:
        "204": {description: Playback updated}
        "400": {description: Invalid track ID or playback patch}
        "401": {description: GM authentication required}
        "404": {description: Table or associated track not found}
        "409": {description: Track is not ready}
  /api/v1/tables/{tableID}/mix:
    parameters:
      - {name: tableID, in: path, required: true, schema: {type: string}}
    put:
      operationId: putTableMix
      summary: Replace the live Discord mix
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveMixSnapshot"
      responses:
        "202": {description: Command dispatched; a mixer result is delivered to table GMs}
        "400": {description: Invalid mix body}
        "401": {description: GM authentication required}
        "404": {description: Table not found}
        "503": {description: Event bus unavailable}
    patch:
      operationId: patchTableMixVolumes
      summary: Replace live Discord mix gains without rebuilding playback
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveMixVolumePatch"
      responses:
        "202": {description: Command dispatched; a mixer result is delivered to table GMs}
        "400": {description: Invalid mix body}
        "401": {description: GM authentication required}
        "404": {description: Table not found}
        "503": {description: Event bus unavailable}
  /api/v1/tables/{tableID}/settings:
    parameters:
      - name: tableID
        in: path
        description: Table's public Base64URL external ID
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    get:
      summary: Get the table's saved GM mix and track order (GM only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Table settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSettings"
        "401":
          description: GM authentication required
        "404":
          description: Table not found
    patch:
      summary: Save partial GM mixing and ordering preferences (GM only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableSettingsPatch"
      responses:
        "200":
          description: Saved table settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableSettings"
        "400":
          description: Invalid table settings
        "401":
          description: GM authentication required
        "404":
          description: Table not found

  /api/v1/tables:
    get:
      summary: List tables (GM only)
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
    post:
      summary: Create a table
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableRequest"
      responses:
        "201":
          description: Created table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Invalid table name

  /api/v1/tables/{tableID}:
    parameters:
      - name: tableID
        in: path
        description: Table's public Base64URL external ID
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    get:
      summary: Get a table using its public external ID
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "404":
          description: Table not found
    put:
      summary: Rename a table (GM only)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableRequest"
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          description: Invalid table name
        "404":
          description: Table not found
    delete:
      summary: Delete a table without deleting library tracks (GM only)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Table deleted
        "404":
          description: Table not found

  /api/v1/tables/{tableID}/external-id:
    post:
      summary: Rotate a table's public external ID (GM only)
      parameters:
        - name: tableID
          in: path
          description: Table's public Base64URL external ID
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Table with its newly generated external ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          description: GM authentication required
        "404":
          description: Table not found

  /api/v1/tables/{tableID}/tracks:
    get:
      summary: List a table's associated tracks using its public table ID
      parameters:
        - name: tableID
          in: path
          description: Table's public Base64URL external ID
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
      responses:
        "200":
          description: Associated tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
        "404":
          description: Table not found

  /api/v1/tables/{tableID}/tracks/{trackID}:
    parameters:
      - name: tableID
        in: path
        description: Table's public Base64URL external ID
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
      - name: trackID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Associate an existing library track (GM only, idempotent)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Track associated
        "404":
          description: Table or track not found
    delete:
      summary: Remove a track from a table without deleting it from the library (GM only)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Track removed
        "404":
          description: Table not found

  /api/v1/login:
    post:
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "500":
          description: Unable to sign in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /api/v1/auth/status:
    get:
      summary: Get current authentication status
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"

  /api/v1/auth/logout:
    post:
      summary: Logout current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logout successful

  /api/v1/files:
    get:
      summary: List all audio tracks
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"
        "403":
          description: Not authorized
    post:
      summary: Upload new audio track
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: string
                  format: binary
                name:
                  type: string
                typeID:
                  type: string
                  format: uuid
                tableID:
                  type: string
                  format: uuid
                  description: Optionally associate the upload with this table atomically.
      responses:
        "202":
          description: File received and track queued for background processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "403":
          description: Not authorized

  /api/v1/files/scan:
    post:
      summary: Scan a YouTube video and validate import limits without downloading audio
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Video metadata and selected audio size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoMetadata"
        "400":
          description: Invalid video URL or request
        "401":
          description: Authentication required
        "422":
          description: Video violates duration, download-size, or live-stream limits
        "502":
          description: Metadata unavailable
        "503":
          description: yt-dlp unavailable
        "504":
          description: Metadata scan timed out

  /api/v1/files/import:
    post:
      summary: Import one public YouTube video's audio using yt-dlp
      description: Queues background retrieval and conversion. Requires yt-dlp, Node.js, and FFmpeg on the server. Playlists and live streams are not supported. Imports are limited to 3 hours, 200 MiB of source audio, and 15 minutes of background processing.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, name, typeID]
              properties:
                url:
                  type: string
                  format: uri
                  description: YouTube watch, shorts, embed, live-video, or youtu.be single-video link.
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                typeID:
                  type: string
                  format: uuid
                tableID:
                  type: string
                  format: uuid
                  description: Optionally associate the imported track with this table atomically.
      responses:
        "202":
          description: Track queued for background retrieval and conversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          description: Invalid link, name, or track type
        "401":
          description: Authentication required
        "404":
          description: Table not found
        "500":
          description: Failed to prepare import
        "503":
          description: yt-dlp is not installed

  /api/v1/files/{trackID}:
    delete:
      summary: Delete an audio track
      security:
        - cookieAuth: []
      parameters:
        - name: trackID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedTableCount
          in: query
          description: Delete only if the track still belongs to this many tables.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Track deleted successfully
        "400":
          description: Invalid track ID or expected table count
        "403":
          description: Not authorized
        "404":
          description: Track not found
        "409":
          description: Table usage changed since it was checked
        "500":
          description: Failed to delete the track
    put:
      summary: Update audio track information
      security:
        - cookieAuth: []
      parameters:
        - name: trackID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrackRequest"
      responses:
        "200":
          description: Track updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          description: Invalid request body
        "403":
          description: Not authorized
        "404":
          description: Track not found
        "500":
          description: Internal server error

  /api/v1/files/{trackID}/tags/{tagID}:
    parameters:
      - name: trackID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tagID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Apply a tag to a track
      description: Idempotent; applying a tag the track already has succeeds.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Track with its updated tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          description: Invalid track or tag ID
        "401":
          description: Not authorized
        "404":
          description: Track or tag not found
        "503":
          description: The change was saved, but live synchronization failed
    delete:
      summary: Remove a tag from a track
      description: Idempotent; removing a tag the track does not have succeeds.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Track with its updated tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          description: Invalid track or tag ID
        "401":
          description: Not authorized
        "404":
          description: Track not found
        "503":
          description: The change was saved, but live synchronization failed

  /api/v1/files/{trackID}/usage:
    get:
      summary: Count the tables containing a library track
      security:
        - cookieAuth: []
      parameters:
        - name: trackID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current table usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackUsage"
        "400":
          description: Invalid track ID
        "401":
          description: Not authorized
        "404":
          description: Track not found
        "500":
          description: Failed to retrieve usage

  /api/v1/files/{trackID}/waveform:
    get:
      summary: Get the amplitude waveform of a track (GM only)
      security:
        - cookieAuth: []
      parameters:
        - name: trackID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Peak amplitudes across the whole track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waveform"
        "400":
          description: Invalid track ID
        "401":
          description: Not authorized
        "404":
          description: Track not found
        "500":
          description: Failed to generate the waveform

  /api/v1/stream/{path}:
    get:
      summary: Stream a library track (GM only)
      security:
        - cookieAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audio stream
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: File not found

  /api/v1/tables/{tableID}/stream/{path}:
    get:
      summary: Stream a track associated with a public table
      parameters:
        - name: tableID
          in: path
          description: Table's public Base64URL external ID
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audio stream
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Table, track, or file not found

  /api/v1/trackTypes:
    get:
      summary: Get available track types
      responses:
        "200":
          description: List of track types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackType"

  /api/v1/tags:
    get:
      summary: List track tags
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Tags ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          description: Not authorized
    post:
      summary: Create a track tag
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRequest"
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Invalid name or color
        "401":
          description: Not authorized
        "409":
          description: A tag with this name already exists
        "503":
          description: The change was saved, but live synchronization failed

  /api/v1/tags/{tagID}:
    put:
      summary: Rename or recolor a track tag
      security:
        - cookieAuth: []
      parameters:
        - name: tagID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagRequest"
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Invalid tag ID, name or color
        "401":
          description: Not authorized
        "404":
          description: Tag not found
        "409":
          description: A tag with this name already exists
        "503":
          description: The change was saved, but live synchronization failed

  /api/v1/ws:
    get:
      summary: WebSocket connection for real-time updates
      parameters:
        - name: tableID
          in: query
          description: Public table external ID for player connections; GMs may omit it to use the default table.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{43}$"
      responses:
        "101":
          description: Switching protocols to WebSocket
        "403":
          description: Not authorized
