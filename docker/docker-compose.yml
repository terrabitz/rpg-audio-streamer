services:
  skald:
    image: ghcr.io/terrabitz/rpg-audio-streamer
    container_name: skald
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: 80
    ports:
      - "80:80"
    volumes:
      - app_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
