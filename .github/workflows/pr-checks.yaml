name: pr-checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
  npm_config_cache: ${{ github.workspace }}/.cache/npm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      embeds: ${{ steps.filter.outputs.embeds }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'
              - '.dockerignore'
              - 'scripts/install-libdave.sh'
              - 'scripts/build-ffmpeg.sh'
              - 'ui/package-lock.json'
              - 'Makefile'
              - '.github/workflows/pr-checks.yaml'
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'sql/**'
              - 'sqlc.yaml'
            frontend:
              - 'ui/**'
              - 'scripts/**/*.mjs'
              - 'openapi.yaml'
            docker:
              - 'docker/**'
              - 'go.mod'
              - 'go.sum'
              - 'main.go'
              - 'internal/**'
              - 'sql/**'
              - 'ui/**'
              - '.github/workflows/docker-build.yaml'
              - 'examples/**'
            embeds:
              - 'examples/**'
              - 'README.md'
              - 'INSTALLATION.md'

  test-image:
    name: Cache Test Devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: |
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.docker == 'true' ||
        needs.changes.outputs.embeds == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          cacheTo: type=gha,scope=test-devcontainer-${{ runner.arch }},mode=max

  go:
    name: Go Offline Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.backend == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Run offline Go tests and coverage
        uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
          runCmd: make test-go

  go-discord:
    name: Go Discord Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.backend == 'true'
      )
    concurrency:
      group: discord-live
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Run live Discord connection integration
        uses: devcontainers/ci@v0.3
        env:
          INTEGRATION_TEST_DISCORD_SERVER_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_SERVER_ID }}
          INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN }}
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
            INTEGRATION_TEST_DISCORD_SERVER_ID
            INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID
            INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN
          runCmd: make test-go-discord

  e2e:
    name: Full App UX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Run non-Discord app UX suite in the devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
          runCmd: make test-e2e
      - name: Retain non-Discord UX failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-app-ux-attempt-${{ github.run_attempt }}
          path: ui/test-results/
          retention-days: 7

  e2e-discord:
    name: Discord App UX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true'
      )
    concurrency:
      group: discord-live
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Run live Discord app UX suite
        uses: devcontainers/ci@v0.3
        env:
          INTEGRATION_TEST_DISCORD_SERVER_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_SERVER_ID }}
          INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_CLIENT_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_CLIENT_ID }}
          INTEGRATION_TEST_DISCORD_BOT_LISTENER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_LISTENER_TOKEN }}
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
            INTEGRATION_TEST_DISCORD_SERVER_ID
            INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID
            INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN
            INTEGRATION_TEST_DISCORD_BOT_STREAMER_CLIENT_ID
            INTEGRATION_TEST_DISCORD_BOT_LISTENER_TOKEN
          runCmd: make test-e2e-discord

  readme-demo:
    name: Check README Demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      github.event_name == 'pull_request' &&
      (
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true'
      )
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Record GM and player flow and refresh changed visual checkpoints
        uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
          runCmd: make test-readme-demo
      - name: Check for material visual changes
        id: compare
        run: |
          git add -- media/readme-demo/gm.png media/readme-demo/player.png
          if git diff --cached --quiet -- media/readme-demo; then
            echo 'README demo is visually unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          staging="$RUNNER_TEMP/readme-demo"
          mkdir -p "$staging"
          cp media/readme-demo/{gm,player}.png "$staging/"
          cp ui/recordings/gm-switches-music-while-a-player-listens.gif "$staging/audio-playing.gif"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.compare.outputs.changed == 'true'
        with:
          name: readme-demo
          path: ${{ runner.temp }}/readme-demo/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: readme-demo-diagnostics-attempt-${{ github.run_attempt }}
          path: ui/test-results/
          retention-days: 7

  publish-readme-demo:
    name: Update README Demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: readme-demo
    if: |
      needs.readme-demo.outputs.changed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: readme-demo
          path: ${{ runner.temp }}/readme-demo
      - name: Commit only the demo assets to the PR branch
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          target="refs/heads/$HEAD_REF"
          remote_head=$(git ls-remote --exit-code origin "$target" | cut -f1)
          if [[ "$remote_head" != "$HEAD_SHA" ]]; then
            echo 'PR branch advanced; leaving its README demo to the newer run.'
            exit 0
          fi
          git lfs install --local
          mkdir -p media/readme-demo
          cp "$RUNNER_TEMP/readme-demo/audio-playing.gif" media/audio-playing.gif
          cp "$RUNNER_TEMP/readme-demo/"{gm,player}.png media/readme-demo/
          git add -- media/audio-playing.gif media/readme-demo/gm.png media/readme-demo/player.png
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: Refresh README demo'
          git push origin "HEAD:$target"

  lint:
    name: Frontend Lint
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
          runCmd: make lint-ui

  build:
    name: Frontend Build
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
          runCmd: make build-ui

  unit:
    name: Frontend Domain Coverage
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
          runCmd: make test-frontend

  docker:
    name: Build Docker Image
    permissions:
      packages: write
    needs: changes
    if: |
      !cancelled() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.docker == 'true'
      )
    uses: ./.github/workflows/docker-build.yaml
    with:
      push: true
      image: ghcr.io/${{ github.repository }}/dev
      tags: ${{ github.event.pull_request.head.sha || github.sha }}

  examples:
    name: Getting Started Examples (${{ matrix.arch }})
    needs: [docker, test-image]
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.test-image.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the branch image
        run: docker pull "$EXAMPLES_IMAGE"
        env:
          EXAMPLES_IMAGE: ${{ needs.docker.outputs.image }}
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Run getting started examples
        uses: devcontainers/ci@v0.3
        env:
          EXAMPLES_IMAGE: ${{ needs.docker.outputs.image }}
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          cacheTo: ${{ matrix.arch == 'arm64' && format('type=gha,scope=test-devcontainer-{0},mode=max', runner.arch) || '' }}
          env: |
            EXAMPLES_IMAGE
            GOMODCACHE
            npm_config_cache
          runCmd: make test-examples

  embeds:
    name: Embedded Examples Up To Date
    needs: [changes, test-image]
    if: |
      !cancelled() && needs.test-image.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.devcontainer == 'true' ||
        needs.changes.outputs.embeds == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify embedded examples
        uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          env: |
            CI=true
            GOMODCACHE
            npm_config_cache
          runCmd: make verify-examples

  pr-checks:
    name: PR Checks
    if: ${{ always() }}
    needs: [changes, test-image, go, go-discord, e2e, e2e-discord, readme-demo, publish-readme-demo, lint, build, unit, docker, examples, embeds]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null; then
            echo "::error::One or more PR checks failed or were cancelled."
            exit 1
          fi
