name: pr-checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'sql/**'
              - 'sqlc.yaml'
              - 'Makefile'
              - '.github/workflows/pr-checks.yaml'
            frontend:
              - 'ui/**'
              - 'scripts/**'
              - 'openapi.yaml'
              - 'Makefile'
              - '.github/workflows/pr-checks.yaml'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'main.go'
              - 'internal/**'
              - 'sql/**'
              - 'ui/**'
              - '.github/workflows/pr-checks.yaml'

  go:
    name: Go Tests and Coverage
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod download
      - name: Run tests
        run: make test-go

  lint:
    name: Frontend Lint
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint:check

  build:
    name: Frontend Build
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  unit:
    name: Frontend Domain Coverage
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  e2e:
    name: Full App UX
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify seeded dev instances
        run: make test-dev
        working-directory: .
      - run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  toolchains:
    name: Check Docker Toolchains
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dependabot bumps go.mod and .nvmrc but not the Dockerfile base images.
      - name: Compare Dockerfile toolchains with project versions
        run: |
          go_required=$(awk '$1 == "go" { print $2 }' go.mod | cut -d. -f1,2)
          go_image=$(sed -nE 's/^FROM golang:([0-9]+\.[0-9]+).*/\1/p' docker/Dockerfile)
          node_required=$(tr -d 'v[:space:]' < ui/.nvmrc | cut -d. -f1)
          node_image=$(sed -nE 's/^FROM node:([0-9]+).*/\1/p' docker/Dockerfile)

          status=0
          if [ "$go_required" != "$go_image" ]; then
            echo "::error file=docker/Dockerfile::Go image is ${go_image:-missing}, go.mod requires $go_required"
            status=1
          fi
          if [ "$node_required" != "$node_image" ]; then
            echo "::error file=docker/Dockerfile::Node image is ${node_image:-missing}, ui/.nvmrc requires $node_required"
            status=1
          fi
          exit $status

  docker:
    name: Build Docker Image
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: testimage
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-checks:
    name: PR Checks
    if: ${{ always() }}
    needs: [changes, go, lint, build, unit, e2e, toolchains, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null; then
            echo "::error::One or more PR checks failed or were cancelled."
            exit 1
          fi
