name: pr-checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'sql/**'
              - 'sqlc.yaml'
              - 'Makefile'
              - '.github/workflows/pr-checks.yaml'
            frontend:
              - 'ui/**'
              - 'scripts/**'
              - 'openapi.yaml'
              - 'Makefile'
              - '.github/workflows/pr-checks.yaml'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'main.go'
              - 'internal/**'
              - 'scripts/install-libdave.sh'
              - 'sql/**'
              - 'ui/**'
              - '.github/workflows/pr-checks.yaml'
              - '.github/workflows/docker-build.yaml'

  go:
    name: Go Tests and Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: discord-live
      queue: max
    steps:
      - name: Require a trusted PR
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: |
          echo "::error::Live Discord tests require repository secrets and cannot run on fork or Dependabot pull requests."
          exit 1
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install libdave
        run: |
          sh scripts/install-libdave.sh "$RUNNER_TEMP/libdave"
          printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/libdave" "$RUNNER_TEMP/libdave" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: go mod download
      - name: Run Go tests and live connection integration
        run: make test-go
        env:
          DISCORD_LIVE_INTEGRATION: '1'
          INTEGRATION_TEST_DISCORD_SERVER_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_SERVER_ID }}
          INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN }}

  e2e:
    name: Full App UX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: discord-live
      queue: max
    steps:
      - name: Require a trusted PR
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: |
          echo "::error::Live Discord tests require repository secrets and cannot run on fork or Dependabot pull requests."
          exit 1
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install libdave
        run: |
          sh scripts/install-libdave.sh "$RUNNER_TEMP/libdave"
          printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/libdave" "$RUNNER_TEMP/libdave" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          go mod download
          npm ci --prefix ui
          cd ui && npx playwright install --with-deps chromium
      - name: Run full app UX suite
        run: make test-e2e
        env:
          INTEGRATION_TEST_DISCORD_SERVER_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_SERVER_ID }}
          INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_CLIENT_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_CLIENT_ID }}
          INTEGRATION_TEST_DISCORD_BOT_LISTENER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_LISTENER_TOKEN }}
      - name: Retain non-Discord UX failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-app-ux-attempt-${{ github.run_attempt }}
          path: ui/test-results/
          retention-days: 7

  lint:
    name: Frontend Lint
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint:check

  build:
    name: Frontend Build
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  unit:
    name: Frontend Domain Coverage
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: node --test e2e/discord-config.test.ts e2e/discord-listener.test.ts
      - run: npm run test:coverage

  docker:
    name: Build Docker Image
    needs: changes
    permissions:
      packages: write
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true') }}
    uses: ./.github/workflows/docker-build.yaml

  pr-checks:
    name: PR Checks
    if: ${{ always() }}
    needs: [changes, go, e2e, lint, build, unit, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null; then
            echo "::error::One or more PR checks failed or were cancelled."
            exit 1
          fi
