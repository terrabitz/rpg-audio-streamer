name: pr-checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      embeds: ${{ steps.filter.outputs.embeds }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'sql/**'
              - 'sqlc.yaml'
              - 'Makefile'
              - '.github/actions/**'
              - '.github/workflows/pr-checks.yaml'
            frontend:
              - 'ui/**'
              - 'scripts/**'
              - 'openapi.yaml'
              - 'Makefile'
              - '.github/actions/**'
              - '.github/workflows/pr-checks.yaml'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'main.go'
              - 'internal/**'
              - 'scripts/install-libdave.sh'
              - 'scripts/build-ffmpeg.sh'
              - 'sql/**'
              - 'ui/**'
              - '.github/workflows/pr-checks.yaml'
              - '.github/workflows/docker-build.yaml'
              - 'examples/**'
            embeds:
              - 'examples/**'
              - 'README.md'
              - 'INSTALLATION.md'
              - 'Makefile'
              - '.github/actions/**'
              - '.github/workflows/pr-checks.yaml'

  go:
    name: Go Offline Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' || 
        needs.changes.outputs.backend == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          frontend: 'false'
      - name: Run offline Go tests and coverage
        run: make test-go
        env:
          DISCORD_LIVE_INTEGRATION: '0'

  go-discord:
    name: Go Discord Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' || 
        needs.changes.outputs.backend == 'true'
      )
    concurrency:
      group: discord-live
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          frontend: 'false'
          media: 'false'
      - name: Run live Discord connection integration
        run: go test -count=1 -race ./internal/discord -run '^TestLiveVoiceConnection$'
        env:
          DISCORD_LIVE_INTEGRATION: '1'
          INTEGRATION_TEST_DISCORD_SERVER_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_SERVER_ID }}
          INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN }}

  e2e:
    name: Full App UX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' || 
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true'
      )
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          playwright: 'true'
      - name: Run non-Discord app UX suite
        working-directory: ui
        run: npm run test:e2e -- --project=chromium --project=chromium-timing --project=chromium-youtube
      - name: Retain non-Discord UX failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-app-ux-attempt-${{ github.run_attempt }}
          path: ui/test-results/
          retention-days: 7

  e2e-discord:
    name: Discord App UX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' || 
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true'
      )
    concurrency:
      group: discord-live
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          playwright: 'true'
      - name: Run live Discord app UX suite
        working-directory: ui
        run: npm run test:e2e -- --project=chromium-discord
        env:
          INTEGRATION_TEST_DISCORD_SERVER_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_SERVER_ID }}
          INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_VOICE_CHANNEL_ID }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_TOKEN }}
          INTEGRATION_TEST_DISCORD_BOT_STREAMER_CLIENT_ID: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_STREAMER_CLIENT_ID }}
          INTEGRATION_TEST_DISCORD_BOT_LISTENER_TOKEN: ${{ secrets.INTEGRATION_TEST_DISCORD_BOT_LISTENER_TOKEN }}

  readme-demo:
    name: README Demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      README_DEMO_DIFF_RATIO: '0.002'
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          playwright: 'true'
      - name: Record GM and player flow and refresh changed visual checkpoints
        working-directory: ui
        env:
          E2E_README_DEMO: '1'
        run: npm run test:e2e:record -- readme-demo.spec.ts --project=chromium --update-snapshots=changed
      - name: Stage material visual changes
        id: compare
        run: |
          git add -- media/readme-demo/gm.png media/readme-demo/player.png
          if git diff --cached --quiet -- media/readme-demo; then
            echo 'README demo is visually unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp ui/recordings/gm-switches-music-while-a-player-listens.gif media/audio-playing.gif
          git add -- media/audio-playing.gif
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Commit only the demo assets to the PR branch
        if: |
          steps.compare.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref != github.event.repository.default_branch &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          target="refs/heads/$HEAD_REF"
          remote_head=$(git ls-remote --exit-code "$remote" "$target" | cut -f1)
          if [[ "$remote_head" != "$HEAD_SHA" ]]; then
            echo 'PR branch advanced; leaving its README demo to the newer run.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: Refresh README demo'
          git push "$remote" "HEAD:$target"
      - uses: actions/upload-artifact@v7
        if: |
          steps.compare.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        with:
          name: readme-demo
          path: |
            media/audio-playing.gif
            media/readme-demo/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: readme-demo-diagnostics-attempt-${{ github.run_attempt }}
          path: ui/test-results/
          retention-days: 7

  lint:
    name: Frontend Lint
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' || 
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          backend: 'false'
          media: 'false'
      - run: npm run lint:check

  build:
    name: Frontend Build
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' || 
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          backend: 'false'
          media: 'false'
      - run: npm run build

  unit:
    name: Frontend Domain Coverage
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.frontend == 'true'        
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          backend: 'false'
          media: 'false'
      - run: node --test e2e/discord-config.test.ts e2e/discord-listener.test.ts e2e/youtube-config.test.ts
      - run: npm run test:coverage

  docker:
    name: Build Docker Image
    permissions:
      packages: write
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' || 
        needs.changes.outputs.docker == 'true'
      )
    uses: ./.github/workflows/docker-build.yaml
    with:
      push: true
      image: ghcr.io/${{ github.repository }}/dev
      tags: ${{ github.event.pull_request.head.sha || github.sha }}

  examples:
    name: Getting Started Examples (${{ matrix.arch }})
    needs: docker
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          backend: 'false'
          frontend: 'false'
          media: 'false'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the branch image
        run: docker pull "$EXAMPLES_IMAGE"
        env:
          EXAMPLES_IMAGE: ${{ needs.docker.outputs.image }}
      - name: Run getting started examples
        run: make test-examples
        env:
          EXAMPLES_IMAGE: ${{ needs.docker.outputs.image }}

  embeds:
    name: Embedded Examples Up To Date
    needs: changes
    if: |
      !cancelled() && 
      (
        github.event_name == 'workflow_dispatch' || 
        needs.changes.outputs.embeds == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
        with:
          backend: 'false'
          frontend: 'false'
          media: 'false'
      - name: Verify embedded examples
        run: make verify-examples

  pr-checks:
    name: PR Checks
    if: ${{ always() }}
    needs: [changes, go, go-discord, e2e, e2e-discord, readme-demo, lint, build, unit, docker, examples, embeds]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null; then
            echo "::error::One or more PR checks failed or were cancelled."
            exit 1
          fi
