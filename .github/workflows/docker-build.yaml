name: docker-build

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push per-architecture images by digest and publish a multi-arch manifest.
        type: boolean
        default: false
      tags:
        description: Newline-separated image tags for the multi-arch manifest. Required when push is true.
        type: string
        default: ""
      image:
        description: Image repository to push to. Defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""
  workflow_call:
    inputs:
      push:
        description: Push per-architecture images by digest and publish a multi-arch manifest.
        type: boolean
        default: false
      tags:
        description: Newline-separated image tags for the multi-arch manifest. Required when push is true.
        type: string
        default: ""
      image:
        description: Image repository to push to. Defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ""
    outputs:
      image:
        description: Reference to the published multi-arch image, using the first tag. Empty when push is false.
        value: ${{ jobs.manifest.outputs.image }}

permissions:
  contents: read
  packages: write

# Callers grant permissions: push requires packages: write.
env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Enable the GitHub Actions cache for Buildx
        uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3

      - name: Login to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          DOCKER_BUILD_FLAGS: >-
            --platform ${{ matrix.platform }}
            --output ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
            --cache-from type=gha,scope=docker-${{ matrix.arch }}
            --cache-to type=gha,mode=max,scope=docker-${{ matrix.arch }}
            --metadata-file "${{ runner.temp }}/build-metadata.json"
        run: make docker-build

      - name: Export digest
        if: inputs.push
        run: |
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/build-metadata.json")
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish Multi-Arch Manifest
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$IMAGE:$tag")
          done <<< "$TAGS"
          if [ ${#tag_args[@]} -eq 0 ]; then
            echo "::error::No image tags provided."
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        id: reference
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          image="$IMAGE:$(printf '%s\n' "$TAGS" | sed '/^$/d' | head -n1)"
          docker buildx imagetools inspect "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
