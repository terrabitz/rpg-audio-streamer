name: warm-caches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm Devcontainer Layers (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for the registry cache
        id: registry_cache
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/test-devcontainer:latest-${{ runner.arch }}
        run: |
          if docker manifest inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/test-devcontainer
          imageTag: latest-${{ runner.arch }}
          push: filter
          refFilterForPush: refs/heads/main
          eventFilterForPush: |
            push
            workflow_dispatch
          noCache: ${{ steps.registry_cache.outputs.exists != 'true' }}
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          cacheTo: type=gha,scope=test-devcontainer-${{ runner.arch }},mode=max
