name: warm-caches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm Devcontainer Layers (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
          cacheTo: type=gha,scope=test-devcontainer-${{ runner.arch }},mode=max
