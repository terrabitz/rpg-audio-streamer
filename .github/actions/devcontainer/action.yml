name: Run in devcontainer
description: Build the repository devcontainer from the layer cache and run a command inside it.

inputs:
  run:
    description: Command to run in the devcontainer. Omit to only build and start it.
    required: false
    default: ''
  env:
    description: Additional environment variable names, one per line, to forward from the calling step's environment.
    required: false
    default: ''
  export-cache:
    description: Export the devcontainer build layers to the GitHub Actions cache.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - uses: actions/cache@v6
      with:
        path: .cache
        key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'ui/package-lock.json') }}
        restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-
    - uses: devcontainers/ci@v0.3
      env:
        GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
        npm_config_cache: ${{ github.workspace }}/.cache/npm
      with:
        push: never
        cacheFrom: type=gha,scope=test-devcontainer-${{ runner.arch }}
        cacheTo: ${{ inputs.export-cache == 'true' && format('type=gha,scope=test-devcontainer-{0},mode=max', runner.arch) || '' }}
        env: |
          CI=true
          GOMODCACHE
          npm_config_cache
          ${{ inputs.env }}
        runCmd: ${{ inputs.run }}
