name: Test devcontainer
description: Build or start the repository devcontainer using shared BuildKit layers.

inputs:
  mode:
    description: Use start for workspace tests, image for Docker examples, or warm to export layers.
    default: start

outputs:
  container-id:
    description: ID of the started container.
    value: ${{ steps.container.outputs.id }}
  workspace:
    description: Workspace path inside the started container.
    value: ${{ steps.container.outputs.workspace }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - uses: crazy-max/ghaction-github-runtime@v4
    - name: Build or start the devcontainer
      id: container
      shell: bash
      env:
        CACHE_SCOPE: test-devcontainer-${{ runner.arch }}
        MODE: ${{ inputs.mode }}
      run: |
        cli=(npx --yes --package @devcontainers/cli@0.91.0 devcontainer)
        cache="type=gha,scope=$CACHE_SCOPE"
        case "$MODE" in
          warm)
            "${cli[@]}" build --workspace-folder . --output type=cacheonly \
              --cache-from "$cache" --cache-to "$cache,mode=max"
            ;;
          image)
            "${cli[@]}" build --workspace-folder . --cache-from "$cache" \
              --image-name rpg-audio-streamer-test-devcontainer
            ;;
          start)
            result=$("${cli[@]}" up --workspace-folder . --cache-from "$cache" --skip-non-blocking-commands)
            jq -er '"id=\(.containerId)\nworkspace=\(.remoteWorkspaceFolder)"' <<< "$result" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error::Unknown devcontainer mode: $MODE"
            exit 1
            ;;
        esac
